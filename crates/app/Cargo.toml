[package]
name = "mikrotik-panel"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
fernet = { version = "0.2.2", default-features = false, features = ["rustcrypto"] }
futures-util = "0.3.34"
getrandom = "0.4.3"
mime_guess = "2.0.5"
panel-agent = { version = "0.1.0", path = "../agent" }
panel-core = { version = "0.1.0", path = "../core-locked" }
rusqlite = { version = "0.43.0", features = ["bundled"] }
rust-embed = { version = "8.14.0", features = ["include-exclude"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = "0.7.20"
toml = "1.2.3"
tower-http = { version = "0.7.1", features = ["set-header", "limit"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
toml = "1.2.3"
tower = { version = "0.5.3", features = ["util"] }

[features]
test-endpoint = ["panel-agent/test-endpoint"]
