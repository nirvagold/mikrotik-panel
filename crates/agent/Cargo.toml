[package]
name = "panel-agent"
version = "0.1.0"
edition = "2024"
description = "Agen AI panel: design spec, sanitizer CSS, katalog alat, klien AI streaming, dan loop agen."

[dependencies]
panel-core = { version = "0.1.0", path = "../core-locked" }
cssparser = "0.38.0"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "sync", "net"] }
tokio-util = "0.7.20"
url = "2.5.9"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-util", "net"] }
