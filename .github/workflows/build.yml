name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Buat rilis dengan tag ini (mis. v0.1.1). Kosongkan untuk build biasa.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm test --if-present
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install zig + cargo-zigbuild
        run: pip install --user ziglang cargo-zigbuild

      - name: Test
        run: cargo test --workspace --locked

      - name: Build static binaries
        env:
          PANEL_VERSION: ${{ inputs.release || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
        run: |
          # PANEL_VERSION = tag tanpa awalan v; kosong di luar rilis (pakai versi Cargo)
          export PANEL_VERSION="${PANEL_VERSION#v}"
          [ -n "$PANEL_VERSION" ] || unset PANEL_VERSION
          mkdir -p dist
          for t in x86_64 aarch64; do
            cargo zigbuild --release --locked -p mikrotik-panel --target $t-unknown-linux-musl
            cp target/$t-unknown-linux-musl/release/mikrotik-panel dist/mikrotik-panel-$t
          done
          cp deploy/update.sh dist/mikrotik-panel-update
          cp deploy/install.sh deploy/mikrotik-panel.service deploy/mikrotik-panel-update.service \
             deploy/mikrotik-panel-update.timer deploy/mikrotik-panel-update-request.service \
             deploy/mikrotik-panel-update-request.path deploy/config.example.toml dist/
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
          if [ -n "${PANEL_VERSION:-}" ]; then
            test "$(./mikrotik-panel-x86_64 version)" = "$PANEL_VERSION"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: mikrotik-panel-${{ github.sha }}
          path: dist/*
          retention-days: 30

      - name: Release (tag v* atau input release)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/*
